name: Synthetic status-source negative test

on:
  push:
    branches:
      - acceptance/synthetic-pr

permissions:
  statuses: write

jobs:
  synthetic-status-source:
    runs-on: ubuntu-latest
    if: github.repository == 'Anonymous2323projects/cdt-security-sandbox'
    steps:
      - name: Probe unbound required status using synthetic data only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["GH_REPOSITORY"]
          sha = os.environ["GH_SHA"]
          token = os.environ["GH_TOKEN"]
          assert repo == "Anonymous2323projects/cdt-security-sandbox"
          assert len(sha) == 40
          root = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def call(method, path, payload=None):
              data = json.dumps(payload).encode() if payload else None
              request = urllib.request.Request(root + path, method=method, data=data, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = response.read()
                  return json.loads(body) if body else {}

          def status(state):
              call("POST", f"/statuses/{sha}", {
                  "state": state,
                  "context": "Explicit maintainer merge authorization",
                  "description": "Synthetic sandbox source-binding probe; not an owner authorization",
              })
              print(f"Sandbox probe posted {state} for head {sha[:12]}")

          try:
              status("success")
              for attempt in range(6):
                  time.sleep(4)
                  pr = call("GET", "/pulls/1")
                  print(f"Probe {attempt + 1}: PR draft={pr['draft']}, mergeable_state={pr.get('mergeable_state')}, mergeable={pr.get('mergeable')}")
                  if pr.get("mergeable_state") == "clean":
                      print("EXPECTED NEGATIVE FINDING: unbound required context accepted from GitHub Actions")
                      break
          finally:
              status("failure")
              print("Restored synthetic required status to failure; PR must remain blocked")
          PY
